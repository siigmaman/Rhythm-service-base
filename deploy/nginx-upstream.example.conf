# Несколько инстансов rhythm_service: один static_config + secdist (общие Redis/Rabbit/PG).
# Порты / адреса подставьте под свои pod или systemd unit-ы.
upstream rhythm_backend {
    least_conn;
    server 127.0.0.1:8080;
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
    # keepalive к апстриму при желании: см. ngx_http_upstream_module (upstream … keepalive).
}

server {
    listen 80;
    client_max_body_size 1m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # POST /action: клиентский Idempotency-Key обычно уже пробрасывается; явно не мешает:
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header Connection "";
        proxy_pass http://rhythm_backend;
    }
}
