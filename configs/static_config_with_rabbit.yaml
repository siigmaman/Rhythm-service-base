# HTTP-сервис + Rabbit publisher (собирать с -DRHYTHM_WITH_RABBITMQ=ON).
# Секреты: configs/secdist_worker.example.json или SECDIST_CONFIG (как у воркера).

components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 4
    fs-task-processor:
      worker_threads: 2

  default_task_processor: main-task-processor

  components:
    secdist: {}

    default-secdist-provider:
      config: configs/secdist_worker.example.json
      missing-ok: true
      environment-secrets-key: SECDIST_CONFIG

    rhythm-rabbit:
      secdist_alias: rhythm-rabbit-alias
      min_pool_size: 1
      max_pool_size: 8
      max_in_flight_requests: 8
      use_secure_connection: false

    rhythm-event-publisher:
      rabbit_name: rhythm-rabbit
      exchange: rhythm.events
      exchange_type: topic
      queue: rhythm.user.action
      bind_routing_key: user.action

    handler-action:
      path: /action
      method: POST
      task_processor: main-task-processor

    handler-recommend:
      path: /recommend
      method: GET
      task_processor: main-task-processor

    handler-product:
      path: /product
      method: GET
      task_processor: main-task-processor

    server:
      listener:
        port: 8080
        task_processor: main-task-processor

    dns-client:
      fs-task-processor: fs-task-processor

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: info
          overflow_behavior: discard
