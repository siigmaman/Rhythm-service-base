components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 4
    fs-task-processor:
      worker_threads: 2

  default_task_processor: main-task-processor

  components:
    # POST /action — JSON в очередь (stub: лог)
    handler-action:
      path: /action
      method: POST
      task_processor: main-task-processor

    # GET /recommend?user_id=
    handler-recommend:
      path: /recommend
      method: GET
      task_processor: main-task-processor

    # GET /product?id=
    handler-product:
      path: /product
      method: GET
      task_processor: main-task-processor

    server:
      listener:
        port: 8080
        task_processor: main-task-processor

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: info
          overflow_behavior: discard
