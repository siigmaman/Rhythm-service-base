# Rabbit + Redis + Postgres (собирать с -DRHYTHM_WITH_RABBITMQ=ON -DRHYTHM_WITH_REDIS=ON -DRHYTHM_WITH_POSTGRES=ON).
# Секреты: configs/secdist_stack.example.json; DSN Postgres поправьте под `rhythm-pg`.

components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 4
    fs-task-processor:
      worker_threads: 2

  default_task_processor: main-task-processor

  components:
    secdist: {}

    default-secdist-provider:
      config: configs/secdist_stack.example.json
      missing-ok: true
      environment-secrets-key: SECDIST_CONFIG

    rhythm-redis:
      groups:
        - config_name: rhythm-redis-secdist
          db: rhythm-cache
          sharding_strategy: RedisCluster
      thread_pools:
        redis_thread_pool_size: 4
        sentinel_thread_pool_size: 1

    rhythm-redis-data:
      redis_component: rhythm-redis
      redis_db: rhythm-cache
      visit_ledger_ttl: 7776000

    rhythm-pg:
      dbconnection: 'postgresql://rhythm:rhythm@127.0.0.1:5432/rhythm'
      blocking_task_processor: fs-task-processor
      dns_resolver: async

    dynamic-config:
      defaults:
        POSTGRES_CONNECTION_POOL_SETTINGS:
          rhythm-pg:
            max_pool_size: 10
            min_pool_size: 1
            max_queue_size: 100

    rhythm-pg-data:
      postgres_name: rhythm-pg

    rhythm-rabbit:
      secdist_alias: rhythm-rabbit-alias
      min_pool_size: 1
      max_pool_size: 8
      max_in_flight_requests: 8
      use_secure_connection: false

    rhythm-event-publisher:
      rabbit_name: rhythm-rabbit
      exchange: rhythm.events
      exchange_type: topic
      queue: rhythm.user.action
      bind_routing_key: user.action

    handler-action:
      path: /action
      method: POST
      task_processor: main-task-processor

    handler-recommend:
      path: /recommend
      method: GET
      task_processor: main-task-processor

    handler-product:
      path: /product
      method: GET
      task_processor: main-task-processor

    server:
      listener:
        port: 8080
        task_processor: main-task-processor

    dns-client:
      fs-task-processor: fs-task-processor

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: info
          overflow_behavior: discard
